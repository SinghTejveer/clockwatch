history:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: clockwatch
    kind:
      default: both
      selector:
        select:
          options:
            - charges
            - trips
            - both
    limit:
      default: 20
      selector:
        number:
          min: 1
          max: 500
    month:
      example: "2026-10"
      selector:
        text:
